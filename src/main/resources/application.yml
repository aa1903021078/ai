server:
  port: 8081

spring:
  data:
    redis:
      host: localhost
      port: 6379


langchain4j:
  open-ai:
    streaming-chat-model:
      base-url: http://localhost:11434/v1
      api-key: ollama
      model-name: qwen3:0.6b
      temperature: 0.7
      # 本地 CPU 推理较慢，默认 60s 容易超时
      timeout: 120s
      log-requests: true
      log-responses: true
